name: Build Mundo Anel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Compile mod
        run: gradle clean build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mundo-anel-fabric-1.21.4
          path: build/libs/mundo-anel-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Mundo Anel 1.0.0
          files: build/libs/mundo-anel-1.0.0.jar
          make_latest: true
